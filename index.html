unction(){    var renderMode = new URLSearchParams(window.location.search).has('render');    if(renderMode){ document.documentElement.classList.add('rendering'); }    var nav = document.getElementById('nav');    var menuBtn = document.getElementById('menu-btn');    menuBtn.addEventListener('click', function(){      nav.classList.toggle('open');      menuBtn.textContent = nav.classList.contains('open') ? '✕' : '☰';    });    function onScroll(){      if(window.scrollY > 40){ nav.classList.add('scrolled'); }      else{ nav.classList.remove('scrolled'); }    }    window.addEventListener('scroll', onScroll, {passive:true});    onScroll();    var revealEls = document.querySelectorAll('.reveal');    if(renderMode){      revealEls.forEach(function(el){ el.classList.add('in'); });    } else if('IntersectionObserver' in window){      var io = new IntersectionObserver(function(entries){        entries.forEach(function(e){          if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }        });      }, {threshold:0.12, rootMargin:'0px 0px -6% 0px'});      revealEls.forEach(function(el){ io.observe(el); });    } else {      revealEls.forEach(function(el){ el.classList.add('in'); });    }    // ===== 首屏 三维倾斜 + 惯性跟随 =====    (function(){      var hero = document.getElementById('hero');      var stage = document.getElementById('hero-stage');      if(!hero || !stage) return;      var maxY = 20;   // 绕 Y 轴 ±20°      var maxX = 8;    // 绕 X 轴 ±8°      var targetX = 0, targetY = 0;      var curX = 0, curY = 0;      var lerp = 0.08; // 惯性缓动系数      var rafId = null;      function loop(){        curX += (targetX - curX) * lerp;        curY += (targetY - curY) * lerp;        stage.style.transform = 'rotateX(' + curX.toFixed(3) + 'deg) rotateY(' + curY.toFixed(3) + 'deg)';        if(Math.abs(targetX - curX) < 0.01 && Math.abs(targetY - curY) < 0.01){          curX = targetX; curY = targetY;          stage.style.transform = 'rotateX(' + targetX + 'deg) rotateY(' + targetY + 'deg)';          rafId = null;          return;        }        rafId = requestAnimationFrame(loop);      }      function kick(){ if(!rafId){ rafId = requestAnimationFrame(loop); } }      hero.addEventListener('mousemove', function(e){        var r = hero.getBoundingClientRect();        var nx = (e.clientX - r.left) / r.width;   // 0..1        var ny = (e.clientY - r.top) / r.height;   // 0..1        targetY = (nx - 0.5) * 2 * maxY;           // 左右 → 绕 Y        targetX = -(ny - 0.5) * 2 * maxX;          // 上下 → 绕 X（俯仰）        kick();      });      hero.addEventListener('mouseleave', function(){        targetX = 0; targetY = 0;        kick();      });    })();  })();</script></body></html>
